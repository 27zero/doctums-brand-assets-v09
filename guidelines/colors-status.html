<!-- @dsCard group="Colors" viewport="700x150" name="Status & Support" subtitle="Success, error, co-brand magenta" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--canvas);font-family:var(--font-sans);padding:20px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border:var(--border-hairline);border-radius:var(--radius-base);overflow:hidden}
  .chip{height:56px}
  .meta{padding:8px 10px}
  .name{font-size:12px;font-weight:600;color:var(--ink-primary)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);text-transform:uppercase}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--signal-green)"></div><div class="meta"><div class="name">Success</div><div class="hex">#0B8250</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--signal-red)"></div><div class="meta"><div class="name">Error / Don't</div><div class="hex">#D8443A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--magenta)"></div><div class="meta"><div class="name">Co-brand Magenta</div><div class="hex">#E6007E</div></div></div>
  </div>
</body></html>
