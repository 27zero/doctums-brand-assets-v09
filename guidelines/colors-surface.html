<!-- @dsCard group="Colors" viewport="700x150" name="Surface & Bounds" subtitle="Canvas, card surface, hairline" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--canvas);font-family:var(--font-sans);padding:20px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border:var(--border-hairline);border-radius:var(--radius-base);overflow:hidden}
  .chip{height:64px}
  .meta{padding:8px 10px}
  .name{font-size:12px;font-weight:600;color:var(--ink-primary)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);text-transform:uppercase}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--canvas)"></div><div class="meta"><div class="name">Canvas</div><div class="hex">#FCFDFE</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-card);border-bottom:var(--border-hairline)"></div><div class="meta"><div class="name">Surface Card</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--hairline)"></div><div class="meta"><div class="name">Hairline</div><div class="hex">#EAEAEA</div></div></div>
  </div>
</body></html>
