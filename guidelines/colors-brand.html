<!-- @dsCard group="Colors" viewport="700x150" name="Brand & Action" subtitle="Doctums Yellow, Marine Blue, Black" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--canvas);font-family:var(--font-sans);padding:20px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border:var(--border-hairline);border-radius:var(--radius-base);overflow:hidden}
  .chip{height:64px;display:flex;align-items:flex-end;padding:8px}
  .meta{padding:8px 10px}
  .name{font-size:12px;font-weight:600;color:var(--ink-primary)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);text-transform:uppercase}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--primary)"><span style="font-family:var(--font-serif);font-weight:700;color:var(--on-primary)">Aa</span></div><div class="meta"><div class="name">Primary · Doctums Yellow</div><div class="hex">#F5C33F</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent)"><span style="font-family:var(--font-serif);font-weight:700;color:var(--on-accent)">Aa</span></div><div class="meta"><div class="name">Accent · Marine Blue</div><div class="hex">#05B6CB</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--doctums-black)"><span style="font-family:var(--font-serif);font-weight:700;color:#fff">Aa</span></div><div class="meta"><div class="name">Ink · Doctums Black</div><div class="hex">#1E1E1E</div></div></div>
  </div>
</body></html>
