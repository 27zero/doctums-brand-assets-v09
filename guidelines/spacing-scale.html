<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing Scale" subtitle="8px base grid" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--canvas);padding:20px 24px;font-family:var(--font-sans)}
  .row{display:flex;align-items:center;gap:14px;padding:4px 0}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);width:130px;flex:none}
  .bar{height:14px;background:var(--primary);border-radius:1px}
</style></head>
<body>
  <div class="row"><span class="tok">xs · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="tok">sm · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tok">md · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tok">lg · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tok">xl · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tok">2xl · 96</span><div class="bar" style="width:96px"></div></div>
  <div class="row"><span class="tok">section · 144</span><div class="bar" style="width:144px"></div></div>
</body></html>
