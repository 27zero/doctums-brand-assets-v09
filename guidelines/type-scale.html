<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--canvas);padding:20px 24px;font-family:var(--font-serif)}
  .row{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px solid var(--gray-100)}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);width:120px;flex:none}
  .spec{color:var(--ink-primary)}
</style></head>
<body>
  <div class="row"><span class="tok">display 64</span><span class="spec" style="font-size:40px">Aa</span></div>
  <div class="row"><span class="tok">headline 48</span><span class="spec" style="font-size:32px">Aa</span></div>
  <div class="row"><span class="tok">title 32</span><span class="spec" style="font-size:24px">Aa</span></div>
  <div class="row"><span class="tok">h4 24</span><span class="spec" style="font-size:20px">Aa</span></div>
  <div class="row"><span class="tok">body 16</span><span class="spec" style="font-size:16px">Aa</span></div>
  <div class="row"><span class="tok">caption 12</span><span class="spec" style="font-size:12px">Aa</span></div>
</body></html>
