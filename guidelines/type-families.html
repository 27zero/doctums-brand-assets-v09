<!-- @dsCard group="Type" viewport="700x200" name="Typefaces" subtitle="Serif / Sans / Mono" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--canvas);padding:24px}
  .fam{padding:12px 0;border-bottom:var(--border-hairline)}
  .fam:last-child{border:none}
  .big{font-size:30px;color:var(--ink-primary)}
  .lbl{font-family:var(--font-sans);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-muted);margin-top:4px}
</style></head>
<body>
  <div class="fam"><div class="big" style="font-family:var(--font-serif)">Georgia — editorial serif</div><div class="lbl">Serif · display, headlines, body reading</div></div>
  <div class="fam"><div class="big" style="font-family:var(--font-sans);font-weight:600">Montserrat — interface sans</div><div class="lbl">Sans · labels, navigation, captions</div></div>
  <div class="fam"><div class="big" style="font-family:var(--font-mono)">Cousine — data mono</div><div class="lbl">Mono · code, tokens, tabular data</div></div>
</body></html>
