<!-- @dsCard group="Brand" viewport="700x340" name="Logo Guidelines" subtitle="Sizes, clear space, approved backgrounds" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--canvas);padding:22px 24px;font-family:var(--font-sans);color:var(--ink-primary)}
  .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}
  .h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-muted);margin:0 0 10px}
  .rule{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--gray-100);font-size:13px}
  .rule b{font-family:var(--font-serif);font-weight:700}
  .val{font-family:var(--font-mono);font-size:12px;color:var(--ink-secondary);white-space:nowrap}
  .bgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{border:1px solid var(--hairline);border-radius:var(--radius-base);height:52px;display:flex;align-items:center;justify-content:center;padding:8px}
  .cap{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);margin-top:5px}
  img{max-height:30px;max-width:88%}
  .clear{position:relative;border:1px dashed var(--hairline-strong);border-radius:var(--radius-base);padding:26px;display:inline-flex;margin-top:4px}
  .clear::after{content:"1X clear space";position:absolute;top:4px;left:8px;font-size:9px;color:var(--ink-muted);font-weight:600;letter-spacing:.06em}
</style></head>
<body>
  <div class="grid">
    <div>
      <p class="h">Sizes & thresholds</p>
      <div class="rule"><b>Hero / cover</b><span class="val">50vw</span></div>
      <div class="rule"><b>Standard use</b><span class="val">20–25vw</span></div>
      <div class="rule"><b>Landscape min</b><span class="val">10–15vw</span></div>
      <div class="rule"><b>Min width · with tagline</b><span class="val">160px</span></div>
      <div class="rule"><b>Min height · main lockup</b><span class="val">80px</span></div>
      <div class="rule"><b>Symbol only</b><span class="val">16px fav · 32px app</span></div>
      <div class="rule" style="border:none"><b>Drop tagline below</b><span class="val">10px / 6pt</span></div>
    </div>
    <div>
      <p class="h">Approved backgrounds</p>
      <div class="bgs">
        <div><div class="tile" style="background:#fff"><img src="../assets/logos/logo-primary.png" alt=""></div><div class="cap">Light · 01 / 04</div></div>
        <div><div class="tile" style="background:var(--doctums-black)"><img src="../assets/logos/logo-mono-white.png" alt=""></div><div class="cap">Dark · 02 / 05</div></div>
        <div><div class="tile" style="background:var(--primary)"><img src="../assets/logos/logo-mono-black.png" alt=""></div><div class="cap">Yellow · 03</div></div>
        <div><div class="tile" style="background:var(--accent)"><img src="../assets/logos/logo-mono-white.png" alt=""></div><div class="cap">Cyan · 06</div></div>
      </div>
      <p class="h" style="margin-top:16px">Clear space</p>
      <div class="clear"><img src="../assets/logos/logo-primary.png" alt="" style="max-height:28px"></div>
    </div>
  </div>
</body></html>
