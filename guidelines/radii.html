<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--canvas);padding:24px;font-family:var(--font-sans);display:flex;gap:24px}
  .item{text-align:center}
  .box{width:88px;height:64px;background:var(--surface-card);border:var(--border-hairline-strong)}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:8px}
</style></head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-none)"></div><div class="lbl">none · 0</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-micro)"></div><div class="lbl">micro · 2 · inputs</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-base)"></div><div class="lbl">base · 4 · cards/buttons</div></div>
</body></html>
