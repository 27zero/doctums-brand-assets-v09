<!-- @dsCard group="Colors" viewport="700x130" name="Neutrals" subtitle="Ink & gray scale" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--canvas);font-family:var(--font-sans);padding:20px}
  .row{display:flex;gap:8px}
  .sw{flex:1}
  .chip{height:56px;border-radius:var(--radius-micro);border:1px solid rgba(0,0,0,0.06)}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);margin-top:6px;text-align:center}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--gray-900)"></div><div class="hex">900</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-700)"></div><div class="hex">700</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-600)"></div><div class="hex">600</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="hex">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-400)"></div><div class="hex">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-300)"></div><div class="hex">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-200)"></div><div class="hex">200</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="hex">100</div></div>
  </div>
</body></html>
