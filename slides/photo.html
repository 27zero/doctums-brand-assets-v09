<!-- @dsCard group="Slides" viewport="1280x720" name="Photo slide" subtitle="Full-bleed image with brand treatment" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;font-family:var(--font-serif);background:#000}
  .slide img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.82) contrast(.96) brightness(1.0)}
  .ov{position:absolute;inset:0;background:var(--gradient-photo-overlay);mix-blend-mode:multiply}
  .scrim{position:absolute;inset:0}
  .pad{position:absolute;inset:0;padding:80px 96px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
  .ey{font-family:var(--font-sans);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--primary)}
  h2{font-size:60px;line-height:1.05;letter-spacing:-.02em;margin:14px 0 0;font-weight:700;max-width:760px}
  p{font-size:20px;line-height:1.5;color:rgba(255,255,255,.85);max-width:520px;margin-top:18px}
  .logo{position:absolute;top:80px;left:96px;height:51px}

  /* Tweaks panel */
  #tweaks{position:fixed;top:16px;right:16px;width:268px;background:#fff;border:1px solid var(--hairline);border-radius:var(--radius-base);box-shadow:var(--elevation-overlay);font-family:var(--font-sans);z-index:9999;display:none;overflow:hidden}
  #tweaks header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--hairline)}
  #tweaks h3{margin:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-primary)}
  #tweaks .x{border:none;background:none;cursor:pointer;font-size:16px;color:var(--ink-muted);line-height:1}
  #tweaks .body{padding:14px;display:flex;flex-direction:column;gap:16px}
  #tweaks label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-bottom:6px}
  #tweaks .row .val{font-family:var(--font-mono);font-size:11px;color:var(--accent);float:right;text-transform:none;letter-spacing:0}
  #tweaks input[type=range]{width:100%;accent-color:var(--accent)}
  #tweaks input[type=text]{width:100%;height:34px;box-sizing:border-box;padding:0 10px;border:1px solid var(--hairline);border-radius:var(--radius-micro);font-family:var(--font-serif);font-size:13px;color:var(--ink-primary)}
  #tweaks input[type=text]:focus{outline:none;border:2px solid var(--accent)}
  #tweaks select{width:100%;height:34px;border:1px solid var(--hairline);border-radius:var(--radius-micro);font-family:var(--font-sans);font-size:13px;padding:0 8px}
</style></head>
<body>
  <div class="slide">
    <img class="bg" src="../assets/imagery/students-01.png" alt="">
    <div class="ov"></div>
    <div class="scrim"></div>
    <img class="logo" src="../assets/logos/logo-mono-white.png" alt="Doctums">
    <div class="pad">
      <div class="ey">Students on campus</div>
      <h2>Community in its everyday state.</h2>
      <p>Authentic, unposed, multiple people in frame — never a single hero. Warm, low-contrast, film-grade.</p>
    </div>
  </div>

  <!-- Tweaks panel -->
  <div id="tweaks">
    <header><h3>Tweaks</h3><button class="x" id="tw-close" aria-label="Close">×</button></header>
    <div class="body">
      <div class="row">
        <label>Logo size <span class="val" id="tw-logo-val"></span></label>
        <input type="range" id="tw-logo" min="20" max="90" step="1">
      </div>
      <div class="row">
        <label>Scrim darkness <span class="val" id="tw-scrim-val"></span></label>
        <input type="range" id="tw-scrim" min="0" max="0.9" step="0.02">
      </div>
      <div class="row">
        <label>Background image</label>
        <select id="tw-bg">
          <option value="architecture-07.png">Architecture 07</option>
          <option value="architecture-14.png">Architecture 14</option>
          <option value="architecture-04.png">Architecture 04</option>
          <option value="movement-06.png">Movement 06</option>
          <option value="movement-09.png">Movement 09</option>
          <option value="practitioners-06.png">Practitioners 06</option>
          <option value="practitioners-11.png">Practitioners 11</option>
        </select>
      </div>
      <div class="row">
        <label>Eyebrow</label>
        <input type="text" id="tw-ey">
      </div>
      <div class="row">
        <label>Headline</label>
        <input type="text" id="tw-h2">
      </div>
    </div>
  </div>

<script>
  const TWEAKS = /*EDITMODE-BEGIN*/{
    "logoHeight": 90,
    "scrim": 0.9,
    "bgImage": "practitioners-06.png",
    "eyebrow": "Students on campus",
    "headline": "Community in its everyday state."
  }/*EDITMODE-END*/;

  const $ = (s) => document.querySelector(s);
  const logo = $('.logo'), scrim = $('.scrim'), bg = $('.bg'), ey = $('.ey'), h2 = $('.slide h2');

  function apply(t){
    logo.style.height = t.logoHeight + 'px';
    $('#tw-logo').value = t.logoHeight; $('#tw-logo-val').textContent = t.logoHeight + 'px';
    scrim.style.background = `linear-gradient(90deg, rgba(0,0,0,${t.scrim}) 0%, rgba(0,0,0,${(t.scrim*0.49).toFixed(3)}) 45%, rgba(0,0,0,0) 75%)`;
    $('#tw-scrim').value = t.scrim; $('#tw-scrim-val').textContent = Math.round(t.scrim*100) + '%';
    bg.src = '../assets/imagery/' + t.bgImage;
    $('#tw-bg').value = t.bgImage;
    ey.textContent = t.eyebrow; $('#tw-ey').value = t.eyebrow;
    h2.textContent = t.headline; $('#tw-h2').value = t.headline;
  }
  apply(TWEAKS);

  function setKey(k, v){
    TWEAKS[k] = v; apply(TWEAKS);
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]:v}}, '*');
  }
  $('#tw-logo').addEventListener('input', e => setKey('logoHeight', parseInt(e.target.value,10)));
  $('#tw-scrim').addEventListener('input', e => setKey('scrim', parseFloat(e.target.value)));
  $('#tw-bg').addEventListener('change', e => setKey('bgImage', e.target.value));
  $('#tw-ey').addEventListener('input', e => setKey('eyebrow', e.target.value));
  $('#tw-h2').addEventListener('input', e => setKey('headline', e.target.value));

  // Host protocol — register listener BEFORE announcing availability
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === '__activate_edit_mode') $('#tweaks').style.display = 'block';
    else if (d.type === '__deactivate_edit_mode') $('#tweaks').style.display = 'none';
  });
  $('#tw-close').addEventListener('click', () => {
    $('#tweaks').style.display = 'none';
    window.parent.postMessage({type:'__edit_mode_dismissed'}, '*');
  });
  window.parent.postMessage({type:'__edit_mode_available'}, '*');
</script>
</body></html>
