<!-- @dsCard group="Slides" viewport="1280x720" name="Data slide" subtitle="Metric grid on dark" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:var(--doctums-black);color:var(--ink-inverse);position:relative;overflow:hidden;font-family:var(--font-serif)}
  .pad{position:absolute;inset:0;padding:80px 96px;display:flex;flex-direction:column}
  .ey{font-family:var(--font-sans);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--primary)}
  h2{font-size:46px;line-height:1.1;letter-spacing:-.02em;margin:14px 0 0;font-weight:700;max-width:760px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);margin-top:auto}
  .cell{background:var(--doctums-black);padding:36px 32px}
  .v{font-size:72px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .v.a{color:var(--accent)}
  .l{font-family:var(--font-sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.6);margin-top:12px}
  .logo{position:absolute;top:80px;right:96px;height:30px;opacity:.8}
</style></head>
<body>
  <div class="slide">
    <img class="logo" src="../assets/logos/logo-mono-white.png" alt="Doctums">
    <div class="pad">
      <div class="ey">Outcomes, not hype</div>
      <h2>What changes when delivery is the point.</h2>
      <div class="grid">
        <div class="cell"><div class="v a">38%</div><div class="l">Faster enrollment cycle</div></div>
        <div class="cell"><div class="v">120+</div><div class="l">Institutions served</div></div>
        <div class="cell"><div class="v a">4.8</div><div class="l">Avg. satisfaction · of 5.0</div></div>
        <div class="cell"><div class="v">99.9%</div><div class="l">Platform uptime</div></div>
      </div>
    </div>
  </div>
</body></html>
